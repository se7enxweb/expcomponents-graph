name: Coding Standard

on:
  # Run on all pushes and on all pull requests.
  push:
    branches:
      master
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# The jobs of zetacomponents/.github/.github/workflows/coding-standard.yml, inlined so the fork can
# add the step that takes unreleased sibling forks from GitHub.
jobs:
  coding-standards:
    name: "Coding Standards"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "8.0"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          tools: "cs2pr"


      - name: Use sibling forks without a Packagist release from GitHub
        # Changes only this checkout's composer.json, and only for a fork that has
        # no release on Packagist yet; released forks resolve as users get them.
        run: |
          todo=$(jq -r '((.require // {}) + (."require-dev" // {})) | keys[] | select(startswith("se7enxweb/expcomponents-"))' composer.json)
          seen=" "
          while [ -n "$(echo $todo)" ]; do
            set -- $todo; pkg=$1; shift; todo="$*"
            case "$seen" in *" $pkg "*) continue ;; esac
            seen="$seen$pkg "
            name=${pkg#se7enxweb/}
            # Packagist also lists the upstream tags the fork inherited; only a
            # newest tag that replaces the zetacomponents name is a fork release.
            if curl -sf "https://repo.packagist.org/p2/$pkg.json" | jq -e --arg p "$pkg" --arg z "zetacomponents/${name#expcomponents-}" '.packages[$p][0].replace // {} | has($z)' >/dev/null; then
              echo "$pkg: fork release on Packagist"
            else
              url="https://github.com/se7enxweb/$name"
              ver=$(git ls-remote --tags --refs "$url" | sed 's#.*refs/tags/##' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
              echo "$pkg: no fork release on Packagist yet, using dev-master of $url as $ver"
              composer config "repositories.$name" "{\"type\": \"vcs\", \"url\": \"$url\", \"no-api\": true}"
              composer require --no-update --no-interaction "$pkg:dev-master as $ver"
            fi
            todo="$todo $(curl -sf "https://raw.githubusercontent.com/se7enxweb/$name/HEAD/composer.json" | jq -r '(.require // {}) | keys[] | select(startswith("se7enxweb/expcomponents-"))')"
          done

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v2"
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist"

      # https://github.com/doctrine/.github/issues/3
      - name: "Run PHP_CodeSniffer"
        run: "vendor/bin/phpcs -q --no-colors --report=checkstyle src | cs2pr"
